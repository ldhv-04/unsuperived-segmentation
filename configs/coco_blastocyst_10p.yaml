# ==============================================================================
# CẤU HÌNH HUẤN LUYỆN BÁN GIÁM SÁT TASDF - LOW-RESOURCE (10% NHÃN)
# ==============================================================================

stage: "coco_blastocyst_10p"

model:
  in_channels: 1
  base_channels: 64
  num_classes: 5
  k_iters: 10

loss:
  lambda_topo: 0.10
  gamma: 0.5
  alpha: 1.0
  max_epochs: 30

# CẤU HÌNH BỘ DỮ LIỆU ĐỘC LẬP 10% NHÃN
dataset:
  type: "coco"
  root_dir: "/home/terminator/workspace/Attech/Research/dataset/Blast_Segment_10p_coco"
  image_size: 256
  split_mode: "physical"
  labeled_ratio: 0.1

training:
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.00005
  checkpoint_dir: "checkpoints"
  log_interval: 20
