# ==============================================================================
# CẤU HÌNH HUẤN LUYỆN BÁN GIÁM SÁT TASDF TRÊN TẬP DỮ LIỆU PHÔI NANG
# ==============================================================================

stage: "coco_blastocyst"

model:
  in_channels: 1
  base_channels: 64
  num_classes: 5
  k_iters: 10

loss:
  lambda_topo: 0.10
  gamma: 0.5
  alpha: 1.0
  max_epochs: 30

# CẤU HÌNH BỘ DỮ LIỆU: Hoàn toàn độc lập, dễ dàng thay đổi sang bộ dữ liệu khác
dataset:
  type: "coco"
  root_dir: "/home/terminator/workspace/Attech/Research/dataset/Blast Segment.v15i.coco-segmentation"
  image_size: 256
  labeled_ratio: 0.2

training:
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.00005
  checkpoint_dir: "checkpoints"
  log_interval: 20
