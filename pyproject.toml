[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tasdf"
version = "0.1.0"
description = "Ultralytics-style decoupled training and inference engine for TASDF embryo segmentation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy",
    "opencv-python",
    "pillow",
    "pyyaml"
]

[project.scripts]
tasdf = "tasdf.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tasdf*"]

[tool.pytest.ini_options]
pythonpath = ["."]

